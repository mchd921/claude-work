<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1020">
<title>ブロック崩し</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1020;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #161830;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  // ===== 画面サイズ（ゲーム内の座標系） =====
  const W = 480, H = 640;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ===== 設定 =====
  const COLORS = ['#ff5c7a', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe', '#fd79a8', '#00d2d3'];
  const COLS = 8, BW = 52, BH = 20, GAP = 6, TOP = 80;
  const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
  const MAX_SPEED = 11;
  const PAUSE_BTN = { x: W - 44, y: 12, w: 32, h: 32 };

  // ===== 状態 =====
  let state = 'title'; // title / ready / play / pause / over / clear
  let score = 0, lives = 3, level = 1;
  let best = 0;
  try { best = Number(localStorage.getItem('breakout-best')) || 0; } catch (e) {}

  const paddle = { w: 90, h: 12, x: W / 2, y: H - 50 };
  const ball = { x: 0, y: 0, r: 7, vx: 0, vy: 0, speed: 0 };
  let bricks = [];
  let particles = [];

  // ===== 効果音 =====
  let audio = null;
  function unlockAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function beep(freq, dur = 0.06, type = 'square', vol = 0.06) {
    if (!audio) return;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dur);
  }

  // ===== ステージ =====
  function buildLevel() {
    bricks = [];
    const rows = Math.min(4 + level, 8);
    const hardRows = Math.floor(level / 2); // 上の段ほど硬くなる
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        // レベル3以降はところどころ穴をあける
        if (level >= 3 && (r + c + level) % 7 === 0) continue;
        const hp = r < hardRows ? 2 : 1;
        bricks.push({
          x: LEFT + c * (BW + GAP),
          y: TOP + r * (BH + GAP),
          r, c,
          hp, maxHp: hp,
          color: COLORS[r % COLORS.length],
          type: 'normal',
          alive: true,
        });
      }
    }

    // 爆発ブロック：ステージ2から2個、ステージ5から3個。硬くない段から、毎回同じ位置を選ぶ
    if (level >= 2) {
      const soft = bricks.filter((b) => b.hp === 1);
      const count = level >= 5 ? 3 : 2;
      for (let k = 0; k < count && soft.length > 0; k++) {
        const b = soft.splice((level * 7 + k * 13) % soft.length, 1)[0];
        b.type = 'bomb';
        b.color = '#3a3350';
      }
    }
  }

  function resetBall() {
    ball.speed = Math.min(5 + (level - 1) * 0.6, MAX_SPEED - 2);
    ball.vx = 0;
    ball.vy = 0;
    state = 'ready';
  }

  function launch() {
    const a = Math.random() * 0.6 - 0.3;
    ball.vx = ball.speed * Math.sin(a);
    ball.vy = -ball.speed * Math.cos(a);
    state = 'play';
    beep(660, 0.08);
  }

  function newGame() {
    score = 0;
    lives = 3;
    level = 1;
    particles = [];
    buildLevel();
    resetBall();
  }

  function nextLevel() {
    level++;
    particles = [];
    buildLevel();
    resetBall();
  }

  function saveBest() {
    if (score > best) {
      best = score;
      try { localStorage.setItem('breakout-best', String(best)); } catch (e) {}
    }
  }

  // ===== 入力 =====
  let pointerX = null;
  const keys = { left: false, right: false };

  function toGameX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }
  function toGameY(clientY) {
    const rect = canvas.getBoundingClientRect();
    return (clientY - rect.top) / rect.height * H;
  }

  function action() {
    unlockAudio();
    if (state === 'title' || state === 'over') newGame();
    else if (state === 'clear') nextLevel();
    else if (state === 'ready') launch();
    else if (state === 'pause') state = 'play';
  }

  function togglePause() {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') state = 'play';
  }

  addEventListener('pointerdown', (e) => {
    const gx = toGameX(e.clientX), gy = toGameY(e.clientY);
    if ((state === 'play' || state === 'pause') &&
        gx >= PAUSE_BTN.x && gx <= PAUSE_BTN.x + PAUSE_BTN.w &&
        gy >= PAUSE_BTN.y && gy <= PAUSE_BTN.y + PAUSE_BTN.h) {
      unlockAudio();
      togglePause();
      return;
    }
    pointerX = gx;
    action();
  });
  addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || e.buttons || e.pointerType === 'touch') {
      pointerX = toGameX(e.clientX);
    }
  });
  addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; pointerX = null; }
    else if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; pointerX = null; }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
    else if (e.key === 'p' || e.key === 'Escape') togglePause();
  });
  addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') state = 'pause';
  });

  // ===== 更新 =====
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
    }
  }

  function setBallSpeed(s) {
    const cur = Math.hypot(ball.vx, ball.vy) || 1;
    ball.speed = s;
    ball.vx = ball.vx / cur * s;
    ball.vy = ball.vy / cur * s;
  }

  // 爆発ブロックが壊れたとき：周り8マスのブロックを硬さに関係なく壊す。爆発ブロックがあれば連鎖する
  function explode(bomb) {
    beep(110, 0.3, 'sawtooth', 0.1);
    spawnParticles(bomb.x + BW / 2, bomb.y + BH / 2, '#ff9f43');
    for (const o of bricks) {
      if (!o.alive || Math.abs(o.r - bomb.r) > 1 || Math.abs(o.c - bomb.c) > 1) continue;
      o.alive = false;
      score += 10 * level;
      spawnParticles(o.x + BW / 2, o.y + BH / 2, o.color);
      if (o.type === 'bomb') explode(o);
    }
  }

  function update(f) {
    // パドル移動
    if (state !== 'pause') {
      if (keys.left) paddle.x -= 9 * f;
      if (keys.right) paddle.x += 9 * f;
      if (pointerX !== null && !keys.left && !keys.right) paddle.x = pointerX;
      paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
    }

    // パーティクル
    for (const p of particles) {
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.vy += 0.15 * f;
      p.life -= 0.03 * f;
    }
    particles = particles.filter((p) => p.life > 0);

    if (state === 'ready') {
      ball.x = paddle.x;
      ball.y = paddle.y - paddle.h / 2 - ball.r - 1;
      return;
    }
    if (state !== 'play') return;

    // 速いときにすり抜けないよう、細かく分けて動かす
    const steps = Math.ceil(ball.speed * f / 3);
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx * f / steps;
      ball.y += ball.vy * f / steps;

      // 壁
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); beep(300, 0.03); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(300, 0.03); }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); beep(300, 0.03); }

      // 落下
      if (ball.y > H + ball.r) {
        lives--;
        beep(150, 0.3, 'sawtooth', 0.08);
        if (lives <= 0) {
          state = 'over';
          saveBest();
        } else {
          resetBall();
        }
        return;
      }

      // パドル（当たった位置で反射角が変わる）
      if (ball.vy > 0 &&
          ball.y + ball.r >= paddle.y - paddle.h / 2 &&
          ball.y - ball.r <= paddle.y + paddle.h / 2 &&
          Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
        const hit = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
        const ang = hit * 1.05; // 最大およそ60度
        ball.vx = ball.speed * Math.sin(ang);
        ball.vy = -ball.speed * Math.cos(ang);
        ball.y = paddle.y - paddle.h / 2 - ball.r;
        beep(440, 0.05);
      }

      // ブロック
      for (const b of bricks) {
        if (!b.alive) continue;
        const cx = clamp(ball.x, b.x, b.x + BW);
        const cy = clamp(ball.y, b.y, b.y + BH);
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy > ball.r * ball.r) continue;

        if (Math.abs(dx) > Math.abs(dy)) ball.vx = Math.sign(dx) * Math.abs(ball.vx);
        else if (dy !== 0) ball.vy = Math.sign(dy) * Math.abs(ball.vy);
        else ball.vy = -ball.vy;

        b.hp--;
        if (b.hp <= 0) {
          b.alive = false;
          score += 10 * level;
          spawnParticles(b.x + BW / 2, b.y + BH / 2, b.color);
          beep(880 + Math.random() * 200, 0.06);
          if (b.type === 'bomb') explode(b);
        } else {
          score += 5;
          beep(520, 0.05);
        }
        setBallSpeed(Math.min(ball.speed + 0.04, MAX_SPEED));
        break;
      }

      if (bricks.every((b) => !b.alive)) {
        score += lives * 50;
        state = 'clear';
        saveBest();
        beep(523, 0.1, 'triangle', 0.1);
        setTimeout(() => beep(659, 0.1, 'triangle', 0.1), 100);
        setTimeout(() => beep(784, 0.2, 'triangle', 0.1), 200);
        return;
      }
    }
  }

  // ===== 描画 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function text(str, x, y, size, color = '#fff', align = 'center', weight = 'bold') {
    ctx.font = `${weight} ${size}px -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function drawOverlay(lines) {
    ctx.fillStyle = 'rgba(10, 10, 25, 0.72)';
    ctx.fillRect(0, 0, W, H);
    let y = H / 2 - (lines.length - 1) * 22;
    for (const [str, size, color] of lines) {
      text(str, W / 2, y, size, color);
      y += 44;
    }
  }

  function draw() {
    ctx.fillStyle = '#161830';
    ctx.fillRect(0, 0, W, H);

    // HUD
    text(`SCORE ${score}`, 16, 28, 18, '#fff', 'left');
    text(`LV ${level}`, W / 2, 28, 18, '#feca57');
    for (let i = 0; i < lives; i++) {
      ctx.beginPath();
      ctx.arc(W - 64 - i * 18, 28, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ff5c7a';
      ctx.fill();
    }
    // 一時停止ボタン
    if (state === 'play' || state === 'pause') {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      roundRect(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.w, PAUSE_BTN.h, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(PAUSE_BTN.x + 10, PAUSE_BTN.y + 9, 4, 14);
      ctx.fillRect(PAUSE_BTN.x + 18, PAUSE_BTN.y + 9, 4, 14);
    }

    // ブロック
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, BW, BH, 5);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (b.type === 'bomb') {
        ctx.strokeStyle = '#ff9f43';
        ctx.lineWidth = 2;
        ctx.stroke();
        text('✸', b.x + BW / 2, b.y + BH / 2 + 1, 16, '#ff9f43');
        continue;
      }
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(b.x + 3, b.y + 3, BW - 6, 5, 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // パーティクル
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // パドル
    if (state !== 'title') {
      const g = ctx.createLinearGradient(0, paddle.y - paddle.h / 2, 0, paddle.y + paddle.h / 2);
      g.addColorStop(0, '#7ed6ff');
      g.addColorStop(1, '#3a86ff');
      ctx.fillStyle = g;
      roundRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 6);
      ctx.fill();

      // ボール
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 画面ごとの案内
    if (state === 'title') {
      drawOverlay([
        ['ブロック崩し', 40, '#feca57'],
        ['タップでスタート', 22, '#fff'],
        ['指でなぞる / マウス / ←→キーで操作', 15, '#aab'],
        [best ? `ベスト ${best}` : '', 16, '#7ed6ff'],
      ]);
    } else if (state === 'ready') {
      text('タップで発射', W / 2, H / 2 + 60, 20, 'rgba(255,255,255,0.8)');
    } else if (state === 'pause') {
      drawOverlay([
        ['一時停止', 34, '#fff'],
        ['タップで再開', 20, '#aab'],
      ]);
    } else if (state === 'over') {
      drawOverlay([
        ['ゲームオーバー', 36, '#ff5c7a'],
        [`スコア ${score}`, 24, '#fff'],
        [`ベスト ${best}`, 18, '#7ed6ff'],
        ['タップでもう一度', 18, '#aab'],
      ]);
    } else if (state === 'clear') {
      drawOverlay([
        [`ステージ ${level} クリア！`, 34, '#1dd1a1'],
        [`スコア ${score}`, 22, '#fff'],
        ['タップで次のステージへ', 18, '#aab'],
      ]);
    }
  }

  // ===== メインループ =====
  let last = performance.now();
  function loop(now) {
    const f = Math.min((now - last) / (1000 / 60), 3);
    last = now;
    update(f);
    draw();
    requestAnimationFrame(loop);
  }
  buildLevel();
  requestAnimationFrame(loop);

  // ===== テスト用ののぞき窓（tests/check.mjs が使う。ゲームの動きには影響しない） =====
  window.__breakout = {
    get state() { return state; },
    get score() { return score; },
    get lives() { return lives; },
    get level() { return level; },
    set level(v) { level = v; },
    get bricks() { return bricks; },
    ball, paddle, W, H, MAX_SPEED, buildLevel,
  };
})();
</script>
</body>
</html>
